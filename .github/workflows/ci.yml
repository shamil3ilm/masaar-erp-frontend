# Continuous integration for the Masaar ERP frontend.
#
# The workspace scope was renamed @erp/* -> @masaar/* across six packages and
# 191 imports. Nothing would have failed if that rename had been incomplete:
# the packages resolve through pnpm workspace links, so a missed import surfaces
# as a build error on someone's machine, days later. This turns that into a
# push-time failure.
#
# --frozen-lockfile is the point of the install step. It fails when
# pnpm-lock.yaml disagrees with the package.json files, which is exactly the
# state a hand-edited lockfile leaves behind.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # No version here on purpose. package.json pins packageManager to
      # pnpm@9.15.4 and the lockfile is written in that format; naming a
      # version as well makes action-setup fail on the disagreement, and
      # pinning it in two places means they can drift apart.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm turbo test

      - name: Build
        run: pnpm turbo build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    # The suite that stood here before this job did was written against routes
    # and payloads that had since changed, and nothing ran it, so nothing said
    # so. Every spec mocks its own API calls and refuses an unmocked one, so
    # the job needs a browser and a dev server and no backend at all.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright is a devDependency of the staff app, so the browser it
      # downloads has to be asked for from there.
      - name: Install the browser
        run: pnpm --filter @masaar/staff exec playwright install --with-deps chromium

      - name: Run the end-to-end suite
        run: pnpm --filter @masaar/staff e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/staff/playwright-report/
          retention-days: 7
